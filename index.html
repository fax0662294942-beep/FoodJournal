<style>
:root{--bg:#1a1a17;--sf:#242420;--sf2:#2e2e29;--bd:#38382f;--ac:#e8a84c;--acd:rgba(232,168,76,.12);--acb:rgba(232,168,76,.35);--gn:#7ab87a;--gnd:rgba(122,184,122,.12);--rd:#e87a7a;--tx:#f0ede4;--tx2:#a8a49a;--tx3:#5e5a52;--r:14px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;}
#root{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.hdr{padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);flex-shrink:0;background:var(--sf);}
.hdr-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--ac);}
.hdr-sub{font-size:11px;color:var(--tx3);margin-top:1px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sf2);border:2px solid var(--ac);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ac);flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.content{flex:1;overflow-y:auto;padding:14px 14px 0;}
.tabs{display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:6px 0 10px;flex-shrink:0;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;border:none;background:none;color:var(--tx3);transition:color .15s;}
.tab.on{color:var(--ac);}
.tab-ic{font-size:20px;line-height:1;}
.tab-lb{font-size:10px;font-weight:500;letter-spacing:.3px;}
.card{background:var(--sf);border-radius:var(--r);border:1px solid var(--bd);padding:15px;margin-bottom:12px;}
.card-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ac);margin-bottom:12px;}
.ig{margin-bottom:13px;}
.lbl{font-size:10px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.9px;margin-bottom:5px;display:block;}
.inp{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 13px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--ac);}
.inp::placeholder{color:var(--tx3);}
textarea.inp{resize:none;height:66px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;}
.btn:disabled{opacity:.5;cursor:default;}
.btn-p{background:var(--ac);color:#1a1a17;}
.btn-s{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd);}
.btn-full{width:100%;}
.btn-sm{padding:6px 11px;font-size:12px;}
.ico-btn{background:none;border:none;cursor:pointer;color:var(--tx3);font-size:17px;padding:4px;transition:color .15s;line-height:1;}
.mt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.mt-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 4px;cursor:pointer;text-align:center;transition:all .15s;}
.mt-btn.on{background:var(--acd);border-color:var(--ac);}
.mt-ic{font-size:20px;display:block;margin-bottom:3px;}
.mt-lb{font-size:11px;color:var(--tx2);}
.mt-btn.on .mt-lb{color:var(--ac);}
.fs-wrap{position:relative;}
.fs-dd{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);max-height:210px;overflow-y:auto;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.fs-item{padding:9px 13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .1s;}
.fs-item:hover{background:var(--sf);}
.fs-cat{font-size:11px;color:var(--tx3);}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:all .15s;}
.tag.on{background:var(--acd);border-color:var(--ac);color:var(--ac);}
.sf-list{display:flex;flex-direction:column;gap:7px;margin-bottom:11px;}
.sf-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:var(--sf2);border-radius:var(--rs);border:1px solid var(--bd);}
.sf-em{font-size:20px;flex-shrink:0;margin-top:1px;}
.sf-info{flex:1;min-width:0;}
.sf-name{font-size:13px;font-weight:500;margin-bottom:4px;}
.tag-wrap{display:flex;flex-wrap:wrap;gap:5px;}
.dy-day-hdr{display:flex;align-items:center;gap:9px;margin-bottom:9px;margin-top:2px;}
.dy-day-lbl{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;}
.dy-dot{flex:1;height:1px;background:var(--bd);}
.dy-meal{background:var(--sf);border-radius:var(--rs);border:1px solid var(--bd);padding:11px;margin-bottom:7px;}
.dy-meal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.dy-mt{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ac);text-transform:uppercase;letter-spacing:.5px;}
.dy-chips{display:flex;flex-wrap:wrap;gap:5px;}
.dy-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:var(--sf2);border-radius:20px;font-size:12px;color:var(--tx2);border:1px solid var(--bd);}
.dy-note{margin-top:7px;font-size:11px;color:var(--tx3);font-style:italic;}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px;}
.pill{padding:5px 11px;border-radius:20px;font-size:12px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:all .15s;}
.pill.on{background:var(--acd);border-color:var(--ac);color:var(--ac);}
.stat-card{background:var(--acd);border:1px solid var(--acb);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.stat-qlbl{font-size:12px;color:var(--tx2);margin-bottom:6px;}
.stat-num{font-family:'Playfair Display',serif;font-size:42px;font-weight:700;color:var(--ac);line-height:1;}
.stat-unit{font-size:13px;color:var(--tx2);margin-top:3px;}
.stat-date{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--tx);}
.stat-meta{font-size:12px;color:var(--tx3);margin-top:5px;}
.mo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px;}
.mo-btn{padding:8px 4px;border-radius:var(--rs);font-size:12px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;text-align:center;transition:all .15s;}
.mo-btn.on{background:var(--acd);border-color:var(--ac);color:var(--ac);}
.tf-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);}
.tf-row:last-child{border-bottom:none;}
.tf-rank{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--tx3);width:22px;text-align:center;flex-shrink:0;}
.tf-track{flex:1;height:5px;background:var(--sf2);border-radius:3px;overflow:hidden;}
.tf-fill{height:100%;background:var(--ac);border-radius:3px;}
.tf-cnt{font-size:12px;color:var(--tx2);min-width:28px;text-align:right;flex-shrink:0;}
.tf-name{font-size:12px;min-width:80px;flex-shrink:0;}
.cat-hdr{display:flex;align-items:center;gap:7px;padding:10px 2px;cursor:pointer;border-bottom:1px solid var(--bd);}
.cat-hdr-name{font-size:13px;font-weight:500;flex:1;}
.cat-hdr-cnt{font-size:11px;color:var(--tx3);}
.cat-items{padding:6px 0;display:flex;flex-direction:column;gap:2px;}
.cat-food{display:flex;align-items:center;gap:9px;padding:7px 3px;}
.cat-food-em{font-size:17px;}
.cat-food-name{font-size:13px;flex:1;}
.cat-food-sub{font-size:10px;color:var(--tx3);margin-top:1px;}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.badge-g{background:var(--gnd);color:var(--gn);border:1px solid rgba(122,184,122,.3);}
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;padding:28px;text-align:center;}
.login-logo{font-size:52px;margin-bottom:10px;}
.login-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;margin-bottom:7px;}
.login-sub{font-size:14px;color:var(--tx2);line-height:1.65;margin-bottom:38px;max-width:280px;}
.login-btn{display:flex;align-items:center;gap:11px;padding:13px 26px;background:#fff;color:#333;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;}
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 18px;font-size:13px;z-index:999;}
.spin-wrap{display:flex;align-items:center;justify-content:center;padding:32px;}
.spinner{width:28px;height:28px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 16px;color:var(--tx3);}
.empty-ic{font-size:36px;margin-bottom:10px;}
.empty-tx{font-size:13px;line-height:1.55;}
.loading-full{display:flex;align-items:center;justify-content:center;height:100dvh;}
.divider{height:1px;background:var(--bd);margin:11px 0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.smt-btn{flex:1;padding:7px;border-radius:var(--rs);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);transition:all .15s;font-family:'DM Sans',sans-serif;}
.smt-btn.on{background:var(--acd);border-color:var(--ac);color:var(--ac);}
.smtog{display:flex;gap:6px;margin-bottom:10px;}
.cb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.cb-cat{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:11px 6px 9px;cursor:pointer;text-align:center;transition:all .15s;}
.cb-cat:hover{background:var(--acd);border-color:var(--ac);}
.cb-cat-em{font-size:24px;display:block;margin-bottom:4px;}
.cb-cat-name{font-size:10px;font-weight:600;color:var(--tx2);line-height:1.3;}
.cb-bc{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 11px;background:var(--sf2);border-radius:var(--rs);border:1px solid var(--bd);}
.cb-back{background:none;border:none;color:var(--ac);cursor:pointer;font-size:18px;padding:0;line-height:1;}
.cb-path{font-size:12px;color:var(--tx2);}
.cb-subs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
.cb-sub{padding:5px 12px;border-radius:20px;font-size:12px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:all .15s;}
.cb-sub.on{background:var(--acd);border-color:var(--ac);color:var(--ac);}
.cb-foods{display:flex;flex-direction:column;gap:5px;}
.cb-food{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--sf2);border-radius:var(--rs);border:1px solid var(--bd);cursor:pointer;transition:all .15s;}
.cb-food:hover{border-color:var(--ac);}
.cb-food.added{background:var(--acd);border-color:var(--ac);}
.fdp{background:var(--bg);border:1px solid var(--acb);border-radius:var(--rs);padding:11px;margin-top:5px;margin-bottom:2px;}
.fdp-lbl{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.fdp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;}
.fdp-tag{padding:4px 10px;border-radius:20px;font-size:12px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:all .15s;}
.fdp-tag.on{background:var(--acd);border-color:var(--ac);color:var(--ac);font-weight:600;}
.fdp-diet{display:flex;gap:7px;margin-bottom:9px;}
.fdp-dtog{flex:1;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--sf2);cursor:pointer;transition:all .15s;}
.fdp-dtog.on{background:var(--gnd);border-color:var(--gn);}
.fdp-dtog-ic{font-size:16px;flex-shrink:0;}
.fdp-dtog-name{font-size:11px;font-weight:600;color:var(--tx2);}
.fdp-dtog.on .fdp-dtog-name{color:var(--gn);}
.fb-low{background:rgba(122,184,122,.15);color:#7ab87a;border:1px solid rgba(122,184,122,.3);}
.fb-med{background:rgba(232,168,76,.12);color:#e8a84c;border:1px solid rgba(232,168,76,.3);}
.fb-high{background:rgba(232,122,122,.12);color:#e87a7a;border:1px solid rgba(232,122,122,.3);}
.fbadge{display:inline-block;padding:1px 6px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.ds-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:13px;}
.ds-ic{font-size:22px;margin-bottom:5px;}
.ds-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;line-height:1;}
.ds-lbl{font-size:10px;color:var(--tx2);margin-top:3px;line-height:1.3;}
.fbar{display:flex;border-radius:6px;overflow:hidden;height:10px;margin:8px 0 4px;}
.fseg{transition:width .3s;}
.fleg{display:flex;gap:10px;flex-wrap:wrap;}
.fleg-i{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);}
.fleg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tipo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px;}
.tipo-card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:11px 10px;cursor:pointer;transition:all .15s;}
.tipo-card:hover,.tipo-card.on{background:var(--acd);border-color:var(--ac);}
.tipo-card-ic{font-size:20px;margin-bottom:4px;}
.tipo-card-name{font-size:11px;font-weight:600;color:var(--tx2);line-height:1.3;}
.tipo-card.on .tipo-card-name{color:var(--ac);}
.wt-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;}
.wt-tag{padding:4px 10px;border-radius:20px;font-size:12px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:all .15s;}
.wt-tag.on{background:var(--acd);border-color:var(--ac);color:var(--ac);font-weight:600;}
.wt-hist{display:flex;flex-direction:column;gap:6px;}
.wt-row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--sf2);border-radius:var(--rs);border:1px solid var(--bd);}
.wt-peso{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--ac);min-width:60px;}
.wt-info{flex:1;min-width:0;}
.wt-date{font-size:12px;color:var(--tx2);}
.wt-meta{font-size:10px;color:var(--tx3);margin-top:2px;}
</style>
</head>

function matchTipo(tipoId, a) {
  if(tipoId==='t_gluten')    return !!a.gluten && !a.glutenFree;
  if(tipoId==='t_nogluten')  return !a.gluten || !!a.glutenFree;
  if(tipoId==='t_lactose')   return !!a.lactose && !a.lactoseFree;
  if(tipoId==='t_nolactose') return !a.lactose || !!a.lactoseFree;
  if(tipoId==='t_fod_low')   return a.fodmap==='low';
  if(tipoId==='t_fod_med')   return a.fodmap==='med';
  if(tipoId==='t_fod_high')  return a.fodmap==='high';
  if(tipoId==='t_gi_low')    return a.gi==='low';
  if(tipoId==='t_gi_med')    return a.gi==='med';
  if(tipoId==='t_gi_high')   return a.gi==='high';
  if(tipoId==='t_alcolici')  return a.cat==='Alcolici';
  if(tipoId==='t_colazione') return a.cat==='Colazione';
  if(tipoId==='t_dolci')     return a.cat==='Dolci';
  if(tipoId==='t_verdure')   return a.cat==='Verdure';
  if(tipoId==='t_frutta')    return a.cat==='Frutta';
  if(tipoId==='t_pesce')     return a.cat==='Pesce';
  return false;
}

// UTILS
function toDateStr(d){
  var dt=d instanceof Date?d:new Date(d);
  var y=dt.getFullYear(), m=dt.getMonth()+1, g=dt.getDate();
  return y+'-'+(m<10?'0':'')+m+'-'+(g<10?'0':'')+g;
}
function dayStart(s){ return new Date(s+'T00:00:00'); }
function weekStart(){ var d=new Date(); d.setDate(d.getDate()-d.getDay()+(d.getDay()===0?-6:1)); d.setHours(0,0,0,0); return d; }
function monthStart(y,m){ return new Date(y,m,1,0,0,0); }
function monthEnd(y,m){ return new Date(y,m+1,0,23,59,59); }
function daysAgo(d){ return Math.floor((new Date()-(d instanceof Date?d:new Date(d)))/86400000); }
function fmtDate(d){
  var dt=d instanceof Date?d:new Date(d);
  if(toDateStr(dt)===toDateStr(new Date())) return 'Oggi';
  if(toDateStr(dt)===toDateStr(new Date(Date.now()-86400000))) return 'Ieri';
  return dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
}

// FIREBASE
function saveMeal(uid,data){
  return db.collection('foodDiary_logs').add(Object.assign({},data,{userId:uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()}));
}
function delMeal(id){ return db.collection('foodDiary_logs').doc(id).delete(); }
function saveWeight(uid,data){
  return db.collection('foodDiary_weights').add(Object.assign({},data,{userId:uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()}));
}
function getWeights(uid,start,end){
  return db.collection('foodDiary_weights').where('userId','==',uid).where('data','>=',start).where('data','<=',end).orderBy('data','asc').get()
    .then(function(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
}
function delWeight(id){return db.collection('foodDiary_weights').doc(id).delete();}
function getLogs(uid,start,end){
  return db.collection('foodDiary_logs').where('userId','==',uid).where('data','>=',start).where('data','<=',end).orderBy('data','desc').get()
    .then(function(s){ return s.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }); });
}
function getCustomFoods(uid){
  return db.collection('foodDiary_custom_foods').where('userId','==',uid).get()
    .then(function(s){ return s.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }); });
}

function AddMeal(props){

  var notaS=useState(''), nota=notaS[0], setNota=notaS[1];
  var savingS=useState(false), saving=savingS[0], setSaving=savingS[1];
  var imS=useState('browse'), inputMode=imS[0], setInputMode=imS[1];
  var scS=useState(null), selCat=scS[0], setSelCat=scS[1];
  var ssS=useState(null), selSub=ssS[0], setSelSub=ssS[1];
  var qS=useState(''), q=qS[0], setQ=qS[1];
  var ddS=useState(false), showDd=ddS[0], setShowDd=ddS[1];
  var expS=useState(null), expandedId=expS[0], setExpandedId=expS[1];

    var cats=[];
    allFoods.forEach(function(f){ if(cats.indexOf(f.cat)<0) cats.push(f.cat); });
    return cats;
  },[allFoods]);

  var subsForCat=useMemo(function(){
    if(!selCat) return [];
    var subs=[];
    allFoods.forEach(function(f){ if(f.cat===selCat && subs.indexOf(f.sub)<0) subs.push(f.sub); });
    return subs;
  },[selCat,allFoods]);

  var foodsToShow=useMemo(function(){
    if(!selCat) return [];

  var searchResults=useMemo(function(){
    if(q.length<2) return [];

  function pick(f){
    var already=false;
    sel.forEach(function(x){ if(x.id===f.id) already=true; });
    if(already){
      setSel(function(p){ return p.filter(function(x){ return x.id!==f.id; }); });
      setFdata(function(p){ var n=Object.assign({},p); delete n[f.id]; return n; });
      if(expandedId===f.id) setExpandedId(null);
    } else {
      setSel(function(p){ return p.concat([f]); });
      setFdata(function(p){ var n=Object.assign({},p); n[f.id]={tags:[],glutenFree:false,lactoseFree:false}; return n; });

    setSaving(true);

      var d=fdata[f.id]||{};
      return {foodId:f.id,nome:f.nome,em:f.em||'🍽️',cat:f.cat,sub:f.sub,

          </div>
          {inputMode==='search' && (
            <div className="fs-wrap" ref={ddRef}>
              <input className="inp" placeholder="Cerca alimento..." value={q}
                onChange={function(e){setQ(e.target.value);setShowDd(true);}}
                onFocus={function(){setShowDd(true);}}/>
              {showDd && searchResults.length>0 && (
                <div className="fs-dd">
                  {searchResults.map(function(f){
                    return <div key={f.id} className="fs-item" onClick={function(){pick(f);}}>
                      <span>{f.em} {f.nome}</span><span className="fs-cat">{f.cat}</span>

          {inputMode==='browse' && (

// DIARY
function Diary(props){
  var uid=props.uid;
  var logsS=useState([]), logs=logsS[0], setLogs=logsS[1];
  var daysS=useState(7), days=daysS[0], setDays=daysS[1];
  var loadS=useState(true), loading=loadS[0], setLoading=loadS[1];
  var errS=useState(null), error=errS[0], setError=errS[1];
  var CL={low:'fb-low',med:'fb-med',high:'fb-high'};

  useEffect(function(){load();}, [days]);

  function load(){
    setLoading(true); setError(null);
    var start=new Date(); start.setDate(start.getDate()-days); start.setHours(0,0,0,0);
    var end=new Date(); end.setHours(23,59,59,999);
    getLogs(uid,start,end).then(function(data){setLogs(data);}).catch(function(e){setError(e.message);}).finally(function(){setLoading(false);});
  }

  var grouped=useMemo(function(){
    var g={};
    logs.forEach(function(l){
      var d=l.data&&l.data.toDate?l.data.toDate():new Date(l.data);
      var k=toDateStr(d);
      if(!g[k])g[k]=[];
      g[k].push(l);
    });
    var entries=Object.entries(g);
    entries.sort(function(a,b){return b[0]<a[0]?-1:1;});
    return entries;
  },[logs]);

  if(loading) return <div className="spin-wrap"><div className="spinner"/></div>;
  if(error) return (
    <div className="card" style={{borderColor:'var(--rd)'}}>
      <div style={{fontSize:13,color:'var(--rd)',marginBottom:8}}>Errore caricamento</div>
      <div style={{fontSize:11,color:'var(--tx2)',marginBottom:10}}>{error}</div>
      <button className="btn btn-s btn-full" onClick={load}>Riprova</button>
    </div>
  );

  return (
    <div>
      <div className="pills">
        {[7,14,30,60].map(function(d){
          return <div key={d} className={'pill'+(days===d?' on':'')} onClick={function(){setDays(d);}}>Ultimi {d}g</div>;
        })}
      </div>
      {grouped.length===0
        ? <div className="empty"><div className="empty-ic">📔</div><div className="empty-tx">Nessun pasto in questo periodo.</div></div>
        : grouped.map(function(entry){
          var dk=entry[0], dayLogs=entry[1];
          return (
            <div key={dk} style={{marginBottom:18}}>
              <div className="dy-day-hdr">
                <span className="dy-day-lbl">{fmtDate(dk)}</span>
                <div className="dy-dot"/>
              </div>
              {dayLogs.map(function(l){
                var m=MT_MAP[l.tipoPasto]||{ic:'🍽️',lbl:l.tipoPasto||''};
                return (
                  <div key={l.id} className="dy-meal">
                    <div className="dy-meal-hdr">
                      <div className="dy-mt"><span>{m.ic}</span><span>{m.lbl}</span></div>
                      <button className="ico-btn" onClick={function(){delMeal(l.id).then(function(){setLogs(function(p){return p.filter(function(x){return x.id!==l.id;});});});}}>🗑️</button>
                    </div>
                    <div className="dy-chips">
                      {(l.alimenti||[]).map(function(a,i){
                        return (
                          <span key={i} className="dy-chip">
                            <span>{a.em}</span>
                            <span>{a.nome}{a.tags&&a.tags.length?' · '+a.tags.join(', '):''}</span>
                            {a.glutenFree ? <span style={{fontSize:9,color:'var(--gn)'}}>SG</span> : null}
                            {a.lactoseFree ? <span style={{fontSize:9,color:'var(--gn)'}}>SL</span> : null}
                            {a.fodmap ? <span className={'fbadge '+CL[a.fodmap]} style={{fontSize:8}}>FM {a.fodmap}</span> : null}
                            {a.gi ? <span className={'fbadge '+CL[a.gi]} style={{fontSize:8}}>GI {a.gi}</span> : null}
                          </span>
                        );
                      })}
                    </div>
                    {l.nota ? <div className="dy-note">{l.nota}</div> : null}
                  </div>
                );
              })}
            </div>
          );
        })}
    </div>
  );
}

// STATS
function Stats(props){
  var uid=props.uid, allFoods=props.allFoods;
  var modeS=useState('count'), mode=modeS[0], setMode=modeS[1];
  var smS=useState('food'), subMode=smS[0], setSubMode=smS[1];
  var qS=useState(''), q=qS[0], setQ=qS[1];
  var ddS=useState(false), showDd=ddS[0], setShowDd=ddS[1];
  var sfS=useState(null), selFood=sfS[0], setSelFood=sfS[1];
  var stS=useState(null), selTipo=stS[0], setSelTipo=stS[1];
  var pmS=useState('week'), periodMode=pmS[0], setPeriodMode=pmS[1];
  var poS=useState(0), periodOffset=poS[0], setPeriodOffset=poS[1];
  var resS=useState(null), res=resS[0], setRes=resS[1];
  var loadS=useState(false), loading=loadS[0], setLoading=loadS[1];
  var topS=useState([]), top=topS[0], setTop=topS[1];
  var tlS=useState(false), topLoad=tlS[0], setTopLoad=tlS[1];
  var dietS=useState(null), diet=dietS[0], setDiet=dietS[1];
  var dlS=useState(false), dietLoad=dlS[0], setDietLoad=dlS[1];
  var wS=useState([]), weights=wS[0], setWeights=wS[1];
  var wlS=useState(false), wLoad=wlS[0], setWLoad=wlS[1];
  var ddRef=useRef();
  var swipeRef=useRef({});

  useEffect(function(){
    function h(e){if(ddRef.current&&!ddRef.current.contains(e.target))setShowDd(false);}
    document.addEventListener('mousedown',h);
    return function(){document.removeEventListener('mousedown',h);};
  },[]);

  var fdResults=useMemo(function(){
    if(q.length<2) return [];
    var lq=q.toLowerCase();
    return allFoods.filter(function(f){return f.nome.toLowerCase().indexOf(lq)>=0;}).slice(0,10);
  },[q,allFoods]);

  function getDates(){
    var now=new Date();
    if(periodMode==='day'){
      var d=new Date(now);
      d.setDate(d.getDate()+periodOffset);
      d.setHours(0,0,0,0);
      var e=new Date(d); e.setHours(23,59,59,999);
      return {start:d,end:e};
    }
    if(periodMode==='week'){
      var ws=weekStart();
      ws.setDate(ws.getDate()+periodOffset*7);
      var we=new Date(ws); we.setDate(we.getDate()+6); we.setHours(23,59,59,999);
      return {start:ws,end:we};
    }
    // month
    var base=new Date(now.getFullYear(),now.getMonth()+periodOffset,1);
    return {start:monthStart(base.getFullYear(),base.getMonth()),end:monthEnd(base.getFullYear(),base.getMonth())};
  }

  function getPeriodLabel(){
    var now=new Date();
    if(periodMode==='day'){
      if(periodOffset===0) return 'Oggi';
      if(periodOffset===-1) return 'Ieri';
      var d=new Date(now); d.setDate(d.getDate()+periodOffset);
      return d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
    }
    if(periodMode==='week'){
      if(periodOffset===0) return 'Questa settimana';
      if(periodOffset===-1) return 'Settimana scorsa';
      var ws=weekStart(); ws.setDate(ws.getDate()+periodOffset*7);
      var we=new Date(ws); we.setDate(we.getDate()+6);
      return ws.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' - '+we.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
    }
    var base=new Date(now.getFullYear(),now.getMonth()+periodOffset,1);
    if(periodOffset===0) return MESI_L[base.getMonth()];
    return MESI_L[base.getMonth()]+' '+base.getFullYear();
  }

  function doCount(){
    if(!selFood) return;
    setLoading(true);
    var d=getDates();
    getLogs(uid,d.start,d.end).then(function(logs){
      var count=0;
      logs.forEach(function(l){
        var hit=false;
        (l.alimenti||[]).forEach(function(a){if(a.foodId===selFood.id||a.nome.toLowerCase()===selFood.nome.toLowerCase())hit=true;});
        if(hit)count++;
      });
      setRes({type:'count',count:count,label:selFood.nome,em:selFood.em,period:getPeriodLabel()});
    }).catch(function(e){setRes({type:'err',msg:e.message});}).finally(function(){setLoading(false);});
  }

  function doLast(){
    if(!selFood) return;
    setLoading(true);
    db.collection('foodDiary_logs').where('userId','==',uid).orderBy('data','desc').limit(300).get()
      .then(function(s){
        var logs=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        var found=null;
        for(var i=0;i<logs.length;i++){
          var hit=false;
          (logs[i].alimenti||[]).forEach(function(a){if(a.foodId===selFood.id||a.nome.toLowerCase()===selFood.nome.toLowerCase())hit=true;});
          if(hit){found=logs[i];break;}
        }
        if(found){
          var dt=found.data&&found.data.toDate?found.data.toDate():new Date(found.data);
          setRes({type:'last',label:selFood.nome,em:selFood.em,date:dt,days:daysAgo(dt),tipoPasto:found.tipoPasto,nota:found.nota});
        } else {
          setRes({type:'last',label:selFood.nome,em:selFood.em,date:null});
        }
      }).catch(function(e){setRes({type:'err',msg:e.message});}).finally(function(){setLoading(false);});
  }

  function doCountTipo(){
    if(!selTipo) return;
    setLoading(true);
    var d=getDates();
    getLogs(uid,d.start,d.end).then(function(logs){
      var count=0,porzioni=0;
      logs.forEach(function(l){
        var match=0;
        (l.alimenti||[]).forEach(function(a){if(matchTipo(selTipo,a))match++;});
        if(match>0){count++;porzioni+=match;}
      });
      setRes({type:'count_tipo',tipo:TIPO_MAP[selTipo],count:count,porzioni:porzioni,period:getPeriodLabel()});
    }).catch(function(e){setRes({type:'err',msg:e.message});}).finally(function(){setLoading(false);});
  }

  function doLastTipo(){
    if(!selTipo) return;
    setLoading(true);
    db.collection('foodDiary_logs').where('userId','==',uid).orderBy('data','desc').limit(300).get()
      .then(function(s){
        var logs=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        var found=null;
        for(var i=0;i<logs.length;i++){
          var hit=false;
          (logs[i].alimenti||[]).forEach(function(a){if(matchTipo(selTipo,a))hit=true;});
          if(hit){found=logs[i];break;}
        }
        if(found){
          var dt=found.data&&found.data.toDate?found.data.toDate():new Date(found.data);
          var esempi=[];
          (found.alimenti||[]).forEach(function(a){if(matchTipo(selTipo,a)&&esempi.length<3)esempi.push(a.nome);});
          setRes({type:'last_tipo',tipo:TIPO_MAP[selTipo],date:dt,days:daysAgo(dt),esempi:esempi,tipoPasto:found.tipoPasto});
        } else {
          setRes({type:'last_tipo',tipo:TIPO_MAP[selTipo],date:null,days:null});
        }
      }).catch(function(e){setRes({type:'err',msg:e.message});}).finally(function(){setLoading(false);});
  }

  function loadTop(){
    setTopLoad(true);
    var d=getDates();
    getLogs(uid,d.start,d.end).then(function(logs){
      var cnt={};
      logs.forEach(function(l){
        (l.alimenti||[]).forEach(function(a){
          if(!cnt[a.nome])cnt[a.nome]={nome:a.nome,em:a.em||'🍽️',count:0};
          cnt[a.nome].count++;
        });
      });
      var arr=Object.values(cnt).sort(function(a,b){return b.count-a.count;}).slice(0,12);
      setTop(arr);
    }).catch(function(){setTop([]);}).finally(function(){setTopLoad(false);});
  }

  function loadDiet(){
    setDietLoad(true);
    var d=getDates();
    getLogs(uid,d.start,d.end).then(function(logs){
      var r={gf:0,lf:0,fl:0,fm:0,fh:0,gl:0,gm:0,gh:0,tot:0,meals:logs.length};
      logs.forEach(function(l){
        (l.alimenti||[]).forEach(function(a){
          r.tot++;
          if(a.gluten && !a.glutenFree)r.gf++;
          if(a.lactose && !a.lactoseFree)r.lf++;
          if(a.fodmap==='low')r.fl++;
          if(a.fodmap==='med')r.fm++;
          if(a.fodmap==='high')r.fh++;
          if(a.gi==='low')r.gl++;
          if(a.gi==='med')r.gm++;
          if(a.gi==='high')r.gh++;
        });
      });
      setDiet(r);
    }).catch(function(){setDiet(null);}).finally(function(){setDietLoad(false);});
  }

  function loadWeights(){
    setWLoad(true);
    var d=getDates();
    getWeights(uid,d.start,d.end).then(function(data){setWeights(data);}).catch(function(){setWeights([]);}).finally(function(){setWLoad(false);});
  }

  useEffect(function(){
    if(mode==='top'){loadTop();setDiet(null);setWeights([]);}
    else if(mode==='diet'){loadDiet();loadWeights();setTop([]);}
    else{setTop([]);setDiet(null);setWeights([]);}
  },[mode,periodMode,periodOffset]);

  var CL={low:'fb-low',med:'fb-med',high:'fb-high'};

  // Swipe handlers
  function onTouchStart(e){ swipeRef.current.x=e.touches[0].clientX; }
  function onTouchEnd(e){
    var dx=e.changedTouches[0].clientX-swipeRef.current.x;
    if(Math.abs(dx)>50) setPeriodOffset(function(o){return dx<0?o-1:o+1;});
  }

  return (
    <div>
      <div className="pills">
        {[{id:'count',lbl:'Conta'},{id:'last',lbl:'Ultima'},{id:'top',lbl:'Top'},{id:'diet',lbl:'Dieta'}].map(function(m){
          return <div key={m.id} className={'pill'+(mode===m.id?' on':'')} onClick={function(){setMode(m.id);setRes(null);}}>{m.lbl}</div>;

      {/* PERIOD NAVIGATOR */}
      <div className="card" style={{marginBottom:11}} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>

// WEIGHT CHART
function WeightChart(props) {
  var data = props.data || [];
  if(data.length === 0) return (
    <div className="empty" style={{padding:'16px 0'}}>
      <div className="empty-ic" style={{fontSize:24}}>⚖️</div>
      <div className="empty-tx">Nessuna pesata in questo periodo.</div>
    </div>
  );
  var sorted = data.slice().sort(function(a,b){
    var da=a.data&&a.data.toDate?a.data.toDate():new Date(a.data);
    var db=b.data&&b.data.toDate?b.data.toDate():new Date(b.data);
    return da-db;
  });
  var pesos = sorted.map(function(d){return d.peso;});
  var minP = Math.min.apply(null,pesos);
  var maxP = Math.max.apply(null,pesos);
  var pad = Math.max((maxP-minP)*0.15, 0.5);
  minP = minP-pad; maxP = maxP+pad;
  var range = maxP-minP;
  var W=300, H=110, PX=6, PY=20;
  var iW=W-PX*2, iH=H-PY*2;
  function toX(i){return PX+(sorted.length===1?iW/2:i/(sorted.length-1)*iW);}
  function toY(p){return PY+iH-((p-minP)/range*iH);}
  var pts=sorted.map(function(d,i){return toX(i)+','+toY(d.peso);}).join(' ');
  var areaPts=toX(0)+','+(H-2)+' '+pts+' '+toX(sorted.length-1)+','+(H-2);
  return (
    <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',height:130,display:'block'}}>
      <defs>
        <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#e8a84c" stopOpacity="0.25"/>
          <stop offset="100%" stopColor="#e8a84c" stopOpacity="0.02"/>
        </linearGradient>
      </defs>
      <polygon points={areaPts} fill="url(#wg)"/>
      <polyline points={pts} fill="none" stroke="#e8a84c" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {sorted.map(function(d,i){
        var x=toX(i), y=toY(d.peso);
        var dt=d.data&&d.data.toDate?d.data.toDate():new Date(d.data);
        var showLbl=sorted.length<=8||i===0||i===sorted.length-1;
        return (
          <g key={i}>
            <circle cx={x} cy={y} r="3.5" fill="#e8a84c" stroke="#1a1a17" strokeWidth="1.5"/>
            {showLbl && <text x={x} y={y-7} textAnchor="middle" fontSize="8" fill="#e8a84c" fontWeight="700">{d.peso.toFixed(1)}</text>}
            {showLbl && <text x={x} y={H-3} textAnchor="middle" fontSize="7" fill="#5e5a52">{(dt.getDate())+'/'+(dt.getMonth()+1)}</text>}
          </g>
        );
      })}
    </svg>
  );
}

// WEIGHT TAB
function WeightTab(props) {

  var today = toDateStr(new Date());
  var dS=useState(today), date=dS[0], setDate=dS[1];
  var pS=useState(''), pesoStr=pS[0], setPesoStr=pS[1];
  var tS=useState([]), tags=tS[0], setTags=tS[1];
  var nS=useState(''), nota=nS[0], setNota=nS[1];
  var svS=useState(false), saving=svS[0], setSaving=svS[1];
  var hS=useState([]), history=hS[0], setHistory=hS[1];
  var hlS=useState(true), histLoading=hlS[0], setHistLoading=hlS[1];
  var rS=useState(30), chartRange=rS[0], setChartRange=rS[1];
  var WTAGS=['a digiuno','mattina','sera','dopo colazione','dopo pranzo','dopo cena','dopo palestra','gonfiore'];

  useEffect(function(){loadHistory();}, [chartRange]);

  function loadHistory(){
    setHistLoading(true);
    var start=new Date(); start.setDate(start.getDate()-chartRange); start.setHours(0,0,0,0);
    var end=new Date(); end.setHours(23,59,59,999);
    getWeights(uid,start,end).then(function(data){setHistory(data);}).catch(function(){setHistory([]);}).finally(function(){setHistLoading(false);});
  }

  function toggleTag(t){
    setTags(function(prev){return prev.indexOf(t)>=0?prev.filter(function(x){return x!==t;}):prev.concat([t]);});
  }

  function save(){
    var p=parseFloat(pesoStr.replace(',','.'));
    if(!p||isNaN(p)||p<20||p>300) return;
    setSaving(true);
    saveWeight(uid,{data:dayStart(date),peso:p,tags:tags,nota:nota.trim()})
      .then(function(){setPesoStr('');setTags([]);setNota('');loadHistory();})
      .catch(function(e){console.error(e);})
      .finally(function(){setSaving(false);});
  }

  var chartData = history.slice().sort(function(a,b){
    var da=a.data&&a.data.toDate?a.data.toDate():new Date(a.data);
    var db=b.data&&b.data.toDate?b.data.toDate():new Date(b.data);
    return da-db;
  });

  var today_dt = new Date(); today_dt.setHours(0,0,0,0);
  var lastW = null;
  history.forEach(function(w){
    var dt=w.data&&w.data.toDate?w.data.toDate():new Date(w.data);
    dt.setHours(0,0,0,0);
    if(dt.getTime()===today_dt.getTime()) lastW=w;
  });
  var oldest = chartData.length>0?chartData[0]:null;
  var newest = chartData.length>0?chartData[chartData.length-1]:null;
  var diff = (oldest&&newest&&oldest.id!==newest.id) ? newest.peso-oldest.peso : null;

  return (
    <div>
      <div className="card">
        <div className="card-title">⚖️ Andamento peso</div>
        {lastW && (
          <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:10}}>
            <span style={{fontFamily:'Playfair Display',fontWeight:700,fontSize:36,color:'var(--ac)'}}>{lastW.peso.toFixed(1)}</span>
            <span style={{fontSize:13,color:'var(--tx3)'}}>kg oggi</span>
            {diff!==null && (
              <span style={{fontSize:13,color:diff>0?'var(--rd)':'var(--gn)',marginLeft:4}}>
                {diff>0?'+':''}{diff.toFixed(1)} kg ({chartRange}g)
              </span>
            )}
          </div>
        )}
        <div className="pills" style={{marginBottom:8}}>
          {[7,14,30,90].map(function(r){
            return <div key={r} className={'pill'+(chartRange===r?' on':'')} onClick={function(){setChartRange(r);}}>{'Ultimi '+r+'g'}</div>;
          })}
        </div>
        {histLoading ? <div className="spin-wrap"><div className="spinner"/></div> : <WeightChart data={chartData}/>}
      </div>

      <div className="card">
        <div className="card-title">Registra pesata</div>
        <div className="ig">
          <label className="lbl">Data</label>
          <input type="date" className="inp" value={date} max={today} onChange={function(e){setDate(e.target.value);}}/>
        </div>
        <div className="ig">
          <label className="lbl">Peso (kg)</label>
          <input type="number" className="inp" placeholder="es. 72.5" step="0.1" min="20" max="300" value={pesoStr}
            onChange={function(e){setPesoStr(e.target.value);}}/>
        </div>
        <div className="ig">
          <div className="lbl" style={{marginBottom:6}}>Tag</div>
          <div className="wt-tags">
            {WTAGS.map(function(t){
              return <span key={t} className={'wt-tag'+(tags.indexOf(t)>=0?' on':'')} onClick={function(){toggleTag(t);}}>{t}</span>;
            })}
          </div>
        </div>
        <div className="ig">
          <label className="lbl">Nota (opzionale)</label>
          <textarea className="inp" placeholder="Come ti senti, condizioni particolari..." value={nota} onChange={function(e){setNota(e.target.value);}}/>
        </div>
        <button className="btn btn-p btn-full" onClick={save}
          disabled={saving||!pesoStr||isNaN(parseFloat(pesoStr.replace(',','.')))||parseFloat(pesoStr.replace(',','.'))<20}>
          {saving?'Salvataggio...':'Salva pesata'}
        </button>
      </div>

      {history.length>0 && (
        <div className="card">
          <div className="card-title">Storico</div>
          <div className="wt-hist">
            {history.slice().sort(function(a,b){
              var da=a.data&&a.data.toDate?a.data.toDate():new Date(a.data);
              var db=b.data&&b.data.toDate?b.data.toDate():new Date(b.data);
              return db-da;
            }).map(function(w){
              var dt=w.data&&w.data.toDate?w.data.toDate():new Date(w.data);
              return (
                <div key={w.id} className="wt-row">
                  <span className="wt-peso">{w.peso.toFixed(1)} kg</span>
                  <div className="wt-info">
                    <div className="wt-date">{fmtDate(dt)}</div>
                    {(w.tags&&w.tags.length||w.nota) ? (
                      <div className="wt-meta">
                        {w.tags&&w.tags.length?w.tags.join(' · '):''}
                        {w.nota?(w.tags&&w.tags.length?' — ':'')+w.nota:''}
                      </div>
                    ) : null}
                  </div>
                  <button className="ico-btn" onClick={function(){
                    delWeight(w.id).then(function(){setHistory(function(p){return p.filter(function(x){return x.id!==w.id;});});});
                  }}>🗑️</button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// CATALOG
function Catalog(props){
  var uid=props.uid, custom=props.custom, onAdded=props.onAdded;
  var openS=useState({}), open=openS[0], setOpen=openS[1];
  var fqS=useState(''), fq=fqS[0], setFq=fqS[1];
  var showS=useState(false), show=showS[0], setShow=showS[1];
  var nfS=useState({nome:'',cat:'',sub:'',em:'',tags:''}), nf=nfS[0], setNf=nfS[1];
  var savS=useState(false), saving=savS[0], setSaving=savS[1];
  var allFoods=FOODS.concat(custom);
  var CATS=[];
  FOODS.forEach(function(f){if(CATS.indexOf(f.cat)<0)CATS.push(f.cat);});

  var filtered=useMemo(function(){
    if(!fq) return allFoods;
    var lq=fq.toLowerCase();
    return allFoods.filter(function(f){return f.nome.toLowerCase().indexOf(lq)>=0||f.cat.toLowerCase().indexOf(lq)>=0;});
  },[fq,custom]);

  var grouped=useMemo(function(){
    var g={};
    filtered.forEach(function(f){if(!g[f.cat])g[f.cat]=[];g[f.cat].push(f);});
    return g;
  },[filtered]);

  function saveNew(){
    if(!nf.nome||!nf.cat) return;
    setSaving(true);
    var food={id:'custom_'+Date.now(),nome:nf.nome.trim(),cat:nf.cat.trim(),sub:nf.sub.trim()||nf.cat.trim(),em:nf.em||'🍽️',
      tags:nf.tags.split(',').map(function(t){return t.trim();}).filter(Boolean),custom:true};
    addCustomFood(uid,food).then(function(docId){
      onAdded(Object.assign({},food,{firestoreId:docId}));
      setNf({nome:'',cat:'',sub:'',em:'',tags:''});
      setShow(false);
    }).finally(function(){setSaving(false);});
  }

  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <input className="inp" style={{flex:1}} placeholder="Filtra catalogo..." value={fq} onChange={function(e){setFq(e.target.value);}}/>
        <button className="btn btn-p" onClick={function(){setShow(function(s){return !s;});}}>+ Nuovo</button>
      </div>
      {show && (
        <div className="card" style={{marginBottom:12}}>
          <div className="card-title">Aggiungi alimento</div>
          <div className="ig"><label className="lbl">Nome *</label>
            <input className="inp" value={nf.nome} onChange={function(e){setNf(function(p){return Object.assign({},p,{nome:e.target.value});});}}/>
          </div>
          <div className="row2">
            <div className="ig"><label className="lbl">Emoji</label>
              <input className="inp" value={nf.em} onChange={function(e){setNf(function(p){return Object.assign({},p,{em:e.target.value});});}}/>
            </div>
            <div className="ig"><label className="lbl">Categoria *</label>
              <input className="inp" list="cat-list" value={nf.cat} onChange={function(e){setNf(function(p){return Object.assign({},p,{cat:e.target.value});});}}/>
              <datalist id="cat-list">{CATS.map(function(c){return <option key={c} value={c}/>;})}</datalist>
            </div>
          </div>
          <div className="ig"><label className="lbl">Sottocategoria</label>
            <input className="inp" value={nf.sub} onChange={function(e){setNf(function(p){return Object.assign({},p,{sub:e.target.value});});}}/>
          </div>
          <div className="ig"><label className="lbl">Tag (virgola)</label>
            <input className="inp" value={nf.tags} onChange={function(e){setNf(function(p){return Object.assign({},p,{tags:e.target.value});});}}/>
          </div>
          <button className="btn btn-p btn-full" onClick={saveNew} disabled={saving||!nf.nome||!nf.cat}>{saving?'Salvataggio...':'Salva'}</button>
        </div>
      )}
      {Object.entries(grouped).map(function(entry){
        var cat=entry[0], foods=entry[1];
        return (
          <div key={cat} style={{marginBottom:8}}>
            <div className="cat-hdr" onClick={function(){setOpen(function(p){var n=Object.assign({},p);n[cat]=!n[cat];return n;});}}>
              <span className="cat-hdr-name">{CAT_ICONS[cat]||'🍽️'} {cat}</span>
              <span className="cat-hdr-cnt">{foods.length}</span>
              <span style={{color:'var(--tx3)',fontSize:11}}>{open[cat]?'▲':'▼'}</span>
            </div>
            {open[cat] && (
              <div className="cat-items">
                {foods.map(function(f){
                  return (
                    <div key={f.id} className="cat-food">
                      <span className="cat-food-em">{f.em}</span>
                      <div style={{flex:1}}>
                        <div className="cat-food-name">{f.nome}{f.custom?<span className="badge badge-g" style={{marginLeft:5}}>custom</span>:null}</div>
                        <div className="cat-food-sub">{f.sub}{f.tags&&f.tags.length?' · '+f.tags.slice(0,3).join(', '):''}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// APP
function Toast(props){ return props.msg ? <div className="toast">{props.msg}</div> : null; }

function App(){
  var userS=useState(null), user=userS[0], setUser=userS[1];
  var authS=useState(false), authOk=authS[0], setAuthOk=authS[1];
  var tabS=useState('add'), tab=tabS[0], setTab=tabS[1];
  var toastS=useState(''), toast=toastS[0], setToast=toastS[1];
  var customS=useState([]), custom=customS[0], setCustom=customS[1];

  useEffect(function(){
    return auth.onAuthStateChanged(function(u){
      setUser(u); setAuthOk(true);
      if(u) getCustomFoods(u.uid).then(setCustom);
    });
  },[]);

  function showToast(msg){ setToast(msg); setTimeout(function(){setToast('');},2800); }
  var allFoods=useMemo(function(){return FOODS.concat(custom);}, [custom]);

  if(!authOk) return <div className="loading-full"><div className="spinner"/></div>;

  if(!user) return (
    <div className="login">
      <div className="login-logo">🍽️</div>
      <div className="login-title">FoodJournal</div>
      <div className="login-sub">Il tuo diario alimentare personale. Non conta le calorie — racconta cosa mangi.</div>
      <button className="login-btn" onClick={function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}}>
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Accedi con Google
      </button>
    </div>
  );

  var TABS=[{id:'add',ic:'✏️',lb:'Aggiungi'},{id:'diary',ic:'📔',lb:'Diario'},{id:'stats',ic:'📊',lb:'Statistiche'},{id:'peso',ic:'⚖️',lb:'Peso'},{id:'cat',ic:'🗂️',lb:'Catalogo'}];

  return (
    <React.Fragment>
      <div className="hdr">
        <div>
          <div className="hdr-title">FoodJournal</div>
          <div className="hdr-sub">diario alimentare personale</div>
        </div>
        <div className="avatar" onClick={function(){if(window.confirm('Esci?'))auth.signOut();}}>
          {user.photoURL ? <img src={user.photoURL} alt=""/> : (user.displayName?user.displayName.charAt(0):'U')}
        </div>
      </div>
      <div className="content">
        {tab==='add'   ? <AddMeal uid={user.uid} allFoods={allFoods} onSaved={showToast}/> : null}
        {tab==='diary' ? <Diary uid={user.uid}/> : null}
        {tab==='stats' ? <Stats uid={user.uid} allFoods={allFoods}/> : null}
        {tab==='peso'  ? <WeightTab uid={user.uid}/> : null}
        {tab==='cat'   ? <Catalog uid={user.uid} custom={custom} onAdded={function(f){setCustom(function(p){return p.concat([f]);});}} /> : null}
        <div style={{height:14}}/>
      </div>
      <div className="tabs">
        {TABS.map(function(t){
          return (
            <button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={function(){setTab(t.id);}}>
              <span className="tab-ic">{t.ic}</span>
              <span className="tab-lb">{t.lb}</span>
            </button>
          );
        })}
      </div>
      <Toast msg={toast}/>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
